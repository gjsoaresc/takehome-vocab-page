services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vocab
      POSTGRES_PASSWORD: vocab
      POSTGRES_DB: vocab
    ports:
      - '5434:5432'
    volumes:
      - vocab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vocab -d vocab']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vocab-postgres:
